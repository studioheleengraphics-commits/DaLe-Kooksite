name: Airfryertijd toevoegen of bijstellen
description: Iets uitgeprobeerd in de airfryer? Zet het erbij, stel een tijd bij of geef een ster.
title: "Airfryertijd: "
body:
  - type: markdown
    attributes:
      value: |
        Laat de titel beginnen met **Airfryertijd:**, daar wordt dit formulier aan
        herkend. De rest mag rommelig. "15 minuten op 180" is genoeg.

        Bestaat het product al op de site, dan wordt het bijgewerkt in plaats van
        dat er een tweede regel naast komt. Je hoeft dus alleen in te vullen wat
        er verandert.

  - type: input
    id: naam
    attributes:
      label: Wat bak je
      description: >
        Zoals het op de site staat, of zoals je het zelf zou noemen. Bestaat het
        al, dan wordt die tijd bijgewerkt.
      placeholder: Kalkoenblokjes
    validations:
      required: true

  - type: textarea
    id: tijden
    attributes:
      label: Temperatuur en tijd
      description: >
        Verplicht bij iets nieuws. Laat leeg als je alleen een ster wil geven of
        weghalen, dan blijft de bestaande tijd staan. Bak je in twee ronden,
        schrijf ze dan na elkaar. Standen zoals Max Crisp en functies zoals
        Double Stack Pro mag je er gewoon bij zetten.
      placeholder: |
        15 min op 180

        of in twee ronden:
        7 min op 180, dan 3 min op 240 Max Crisp

  - type: dropdown
    id: ster
    attributes:
      label: De ster
      description: >
        Een ster betekent: bij ons uitgetest, deze tijd klopt. Alleen zetten bij
        wat je echt gebakken hebt.
      options:
        - Laat de ster zoals hij nu staat
        - Zet er een ster bij, dit is uitgetest
        - Haal de ster weg, het klopt toch niet

  - type: dropdown
    id: categorie
    attributes:
      label: Waar hoort het thuis
      description: Alleen nodig bij iets nieuws. Twijfel je, laat het dan op de eerste staan.
      options:
        - Kies zelf maar
        - Diepvries
        - Aardappel
        - Groenten
        - Vlees en gevogelte
        - Vis
        - Hapjes
        - Brood en bakken
        - Opwarmen

  - type: textarea
    id: extra
    attributes:
      label: Iets dat erbij hoort
      description: >
        Of je schudde en hoe vaak, hoe vol de mand zat, waaraan je zag dat het
        klaar was, welk merk het was. Alles wat je niet zegt, wordt ook niet
        verzonnen, en wat er al staat blijft gewoon staan.
      placeholder: Optioneel.
