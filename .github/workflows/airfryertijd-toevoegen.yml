name: Airfryertijd toevoegen

# Maak een issue aan met het formulier "Airfryertijd toevoegen", en deze
# workflow zet het om naar een product in airfryer/*.json, draait de
# generator en publiceert het.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  id-token: write

# Deelt de wachtrij met de receptworkflow, want ze pushen allebei naar main.
concurrency:
  group: site-publiceren
  cancel-in-progress: false

jobs:
  airfryertijd:
    # Alleen issues van de eigenaar zelf zetten dit in gang, en alleen die van
    # het airfryerformulier. De titel is de scheidingslijn met de recepten.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, 'Airfryertijd:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Zolang het secret niet klaarstaat, doet deze workflow niets. Zo krijg
      # je geen mislukte runs op elke issue die je aanmaakt.
      - id: sleutel
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "klaar=ja" >> "$GITHUB_OUTPUT"
          else
            echo "klaar=nee" >> "$GITHUB_OUTPUT"
            echo "Secret CLAUDE_CODE_OAUTH_TOKEN ontbreekt, deze run stopt hier."
          fi

      - uses: actions/checkout@v6
        if: steps.sleutel.outputs.klaar == 'ja'
        with:
          ref: main

      # Via een bestand, niet rechtstreeks in de prompt: de tekst van een
      # issue mag aanhalingstekens en regeleindes bevatten zonder dat de
      # workflow erover struikelt.
      - name: De tijd in een bestand zetten
        if: steps.sleutel.outputs.klaar == 'ja'
        env:
          TITEL: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          {
            echo "# $TITEL"
            echo
            echo "$BODY"
          } > .airfryer-inbox.md

      - uses: anthropics/claude-code-action@v1
        if: steps.sleutel.outputs.klaar == 'ja'
        with:
          # Draait op je Claude-abonnement, dus zonder API-kosten.
          # Het secret maak je met: claude setup-token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            In .airfryer-inbox.md staat een airfryertijd die Leen wil toevoegen
            aan Crispy DaLe, de airfryersite onder docs/airfryer/.

            Lees eerst CLAUDE.md, hoofdstuk "Airfryertijden: Crispy DaLe". Daar
            staat de structuur van een product en wat elk veld doet. Houd je
            daar strikt aan.

            Werkwijze:
            1. Lees .airfryer-inbox.md en CLAUDE.md.
            2. Kies het juiste bestand in airfryer/. Staat er een categorie in
               het formulier, volg die dan. Staat er "Kies zelf maar", kies dan
               de categorie waar het product thuishoort. Maak geen nieuwe
               categorie aan tenzij het echt nergens past.
            3. Bestaat er al een product met dezelfde of vrijwel dezelfde naam,
               werk dat dan bij. Zet er geen tweede regel naast, want twee
               waarheden naast elkaar maken de lijst onbetrouwbaar.
            4. Schrijf minuten altijd als een lijst van twee: een vaste tijd
               van 15 minuten wordt [15, 15].
            5. Twee ronden na elkaar schrijf je als stappen, met een korte
               kop in het veld wat, bijvoorbeeld "Garen" en "Afwerken".
            6. Max Crisp is een stand met een eigen temperatuur en hoort in
               het veld stand. Double Stack Pro is een functie die bij eender
               welke stand kan en hoort in het veld functie.
            7. Zet getest op true als het vinkje "Dit heb ik zelf gebakken"
               is aangekruist, en anders niet.
            8. Verzin niets. Staat er niets over schudden, voorverwarmen,
               de hoeveelheid in de mand of waaraan je ziet dat het klaar is,
               laat die velden dan gewoon weg. De site zwijgt er dan over,
               en dat is beter dan een verzonnen cijfer bij vlees.
            9. Vul trefwoorden aan met woorden waarop Leen zou zoeken, ook
               een merknaam als die genoemd wordt.
            10. Verwijder .airfryer-inbox.md weer.
            11. Draai python3 build.py.
            12. Commit in het Nederlands als "airfryertijd toegevoegd: <naam>"
                of "airfryertijd bijgewerkt: <naam>", en push naar main.

            Maak geen pull request en pas docs/ nooit met de hand aan, die map
            wordt volledig door build.py geschreven.

            Sluit af met een korte alinea over wat je toegevoegd of bijgewerkt
            hebt, in welke categorie, en welke velden je hebt weggelaten omdat
            de gegevens ontbraken.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"
            --max-turns 30

      - name: Melden dat het gelukt is
        if: success() && steps.sleutel.outputs.klaar == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "De tijd staat op de site. Geef GitHub Pages een minuutje en ververs dan https://studioheleengraphics-commits.github.io/DaLe-Kooksite/airfryer/

          Klopt er iets niet, open dan een nieuwe issue met wat er anders moet.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          gh issue close "${{ github.event.issue.number }}"

      - name: Melden dat het misliep
        if: failure() && steps.sleutel.outputs.klaar == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "Er liep iets mis bij het verwerken van deze airfryertijd. De issue blijft open staan.

          Wat er precies gebeurde, staat in het logboek van deze run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
