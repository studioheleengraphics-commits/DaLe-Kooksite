name: Recept toevoegen

# Maak een issue aan met een recept erin, en deze workflow zet het om naar
# een receptpagina, draait de generator en publiceert het.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  id-token: write

# Twee dingen tegelijk zouden elkaar op main in de weg zitten. De
# airfryerworkflow deelt deze wachtrij, want die pusht naar dezelfde branch.
concurrency:
  group: site-publiceren
  cancel-in-progress: false

jobs:
  recept:
    # Alleen issues van wie hieronder staat zetten dit in gang. Een
    # voorbijganger die een issue opent op deze publieke repo start hier dus
    # niets mee. Een airfryertijd gaat naar zijn eigen workflow, niet hierheen.
    # Iemand erbij of eruit? Pas het lijstje aan, hier en in
    # airfryertijd-toevoegen.yml, want de twee horen gelijk te lopen.
    if: >-
      contains(fromJSON('["studioheleengraphics-commits", "Smekke1976"]'),
      github.event.issue.user.login) &&
      !startsWith(github.event.issue.title, 'Airfryertijd:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Zolang het secret niet klaarstaat, doet deze workflow niets. Zo krijg
      # je geen mislukte runs op elke issue die je aanmaakt.
      - id: sleutel
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "klaar=ja" >> "$GITHUB_OUTPUT"
          else
            echo "klaar=nee" >> "$GITHUB_OUTPUT"
            echo "Secret CLAUDE_CODE_OAUTH_TOKEN ontbreekt, deze run stopt hier."
          fi

      # Niets doen is verwarrend, dus zeggen wat eraan scheelt.
      - name: Melden dat de sleutel nog ontbreekt
        if: steps.sleutel.outputs.klaar == 'nee'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Dit recept is nog niet verwerkt, want het automatisch toevoegen staat nog uit.

          Om het aan te zetten is er één ding nodig: een token onder Settings > Secrets and variables > Actions, met als naam \`CLAUDE_CODE_OAUTH_TOKEN\`. Je maakt er een met \`claude setup-token\`, en dat draait op je Claude-abonnement zonder extra kosten.

          Zolang dat er niet staat, blijft deze issue gewoon openstaan als geheugensteun.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

      - uses: actions/checkout@v6
        if: steps.sleutel.outputs.klaar == 'ja'
        with:
          ref: main

      # Via een bestand, niet rechtstreeks in de prompt: de tekst van een
      # issue mag aanhalingstekens en regeleindes bevatten zonder dat de
      # workflow erover struikelt.
      - name: Recept in een bestand zetten
        if: steps.sleutel.outputs.klaar == 'ja'
        env:
          TITEL: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          {
            echo "# $TITEL"
            echo
            echo "$BODY"
          } > .recept-inbox.md

      - uses: anthropics/claude-code-action@v1
        if: steps.sleutel.outputs.klaar == 'ja'
        with:
          # Draait op je Claude-abonnement, dus zonder API-kosten.
          # Het secret maak je met: claude setup-token
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            In .recept-inbox.md staat een recept dat Leen ergens tegenkwam.
            Zet het om naar een receptpagina op deze site.

            Lees eerst CLAUDE.md in de repo. Daar staan de schrijfregels, de
            structuur van een recept en de huisstijl. Houd je daar strikt aan,
            zeker aan de regels over de intro, de stapkoppen en de tip.

            Werkwijze:
            1. Lees .recept-inbox.md en CLAUDE.md.
            2. Schrijf recepten/<slug>.json volgens de structuur uit CLAUDE.md.
               De slug bestaat uit kleine letters en streepjes, zonder accenten,
               en is gelijk aan de bestandsnaam zonder .json. Bestaat het
               bestand al, werk het dan bij in plaats van een tweede aan te maken.
            3. Verzin geen cijfers. Neem alleen kooktijden, gewichten, porties
               en voedingswaarden over die in de bron staan of er betrouwbaar
               uit af te leiden zijn. Ontbreekt het aantal porties, ga dan uit
               van 4 en vermeld dat in je slotbericht.
            4. Zet schaal:false bij ingredienten die niet mogen meeschalen.
            5. Laat het veld pdf weg. De A4 wordt apart gemaakt, en de
               receptpagina houdt sowieso een printknop.
            6. Verwijder .recept-inbox.md weer.
            7. Draai python3 build.py.
            8. Commit in het Nederlands als "recept toegevoegd: <titel>" en
               push naar main.

            Maak geen pull request en pas docs/ nooit met de hand aan, die map
            wordt volledig door build.py geschreven.

            Sluit af met een korte alinea over wat je gemaakt hebt en welke
            keuzes je hebt moeten maken bij ontbrekende gegevens.
          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash"
            --max-turns 30

      - name: Melden dat het gelukt is
        if: success() && steps.sleutel.outputs.klaar == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Het recept staat op de site. Geef GitHub Pages een minuutje en ververs dan https://studioheleengraphics-commits.github.io/DaLe-Kooksite/

          Klopt er iets niet aan de tekst, open dan een nieuwe issue met wat er anders moet.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"

      - name: Melden dat het misliep
        if: failure() && steps.sleutel.outputs.klaar == 'ja'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Er liep iets mis bij het verwerken van dit recept. De issue blijft open staan.

          Wat er precies gebeurde, staat in het logboek van deze run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"

  # Wie niet in het lijstje hierboven staat, krijgt een antwoord in plaats van
  # stilte. De airfryertijden hebben hun eigen versie hiervan, gesplitst op
  # dezelfde titelregel, zodat niemand twee berichten krijgt op een issue.
  onbekende-afzender:
    if: >-
      !contains(fromJSON('["studioheleengraphics-commits", "Smekke1976"]'),
      github.event.issue.user.login) &&
      !startsWith(github.event.issue.title, 'Airfryertijd:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Meer dan een berichtje schrijven hoeft deze job niet te kunnen.
    permissions:
      issues: write
    steps:
      # Zonder checkout weet gh niet over welke repo het gaat, vandaar --repo.
      - name: Uitleggen waarom er niets gebeurt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body "Dank je wel, maar er is met dit bericht niets veranderd aan de site.

          Dit kookboek wordt bijgehouden door een klein clubje, en jouw GitHub-naam staat niet in dat lijstje. Hoor je erbij en is dit een vergetelheid? Laat het Leen weten, dan komt je naam erbij en werkt je volgende bericht wel meteen.

          Je bericht blijft hier gewoon staan, dus getypt werk gaat niet verloren.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
